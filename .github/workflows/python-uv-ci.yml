# Reusable CI for Python projects managed with uv.
# The Python version comes from each calling repo's .python-version (nothing is hard-coded here).
name: Python uv CI

on:
  workflow_call:
    inputs:
      pyright:
        description: Run pyright type checking
        type: boolean
        default: true
      pytest:
        description: Run pytest
        type: boolean
        default: true
      pytest-args:
        description: Extra arguments passed to pytest
        type: string
        default: "-v --durations=0"
      pip-audit:
        description: Audit locked dependencies with pip-audit
        type: boolean
        default: true
      pip-audit-ignore:
        description: >
          Space- or comma-separated vulnerability IDs for pip-audit to ignore
          (for example GHSA-xxxx or CVE-2024-xxxx).
        type: string
        default: ""
    secrets:
      QUANDL_API_KEY:
        description: Optional API key exposed to the test step (data_dashboard_project)
        required: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Job-level concurrency is required inside a reusable workflow.
    # github.workflow / github.ref come from the caller. Do not use
    # github.job in the group: in a reusable workflow it is the *caller's*
    # job id (often `ci`), so checks and pip-audit would share a group and
    # cancel each other. Use a unique suffix per callee job instead.
    # Cancel only PR runs so a new synchronize cancels the outdated one;
    # default-branch (push) runs are never cancelled from here.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-checks
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    env:
      ENV: github
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Show Python version
        run: |
          echo "Python requested by .python-version: $(cat .python-version 2>/dev/null || echo '<none>')"

      - name: Check lock file is up to date
        id: lock
        run: uv lock --locked

      - name: Install dependencies
        id: sync
        run: uv sync --locked --all-groups

      - name: Ruff lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check --diff .

      - name: Pyright
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.pyright }}
        run: uv run pyright .

      - name: Pytest
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && inputs.pytest }}
        env:
          QUANDL_API_KEY: ${{ secrets.QUANDL_API_KEY }}
          PYTEST_ARGS: ${{ inputs.pytest-args }}
        run: |
          # Split caller-provided pytest args on whitespace (default: -v --durations=0).
          read -r -a extra <<< "${PYTEST_ARGS}"
          uv run pytest "${extra[@]}" --cov --cov-report=term --cov-report=markdown:COVERAGE.md

      - name: Coverage summary
        if: ${{ !cancelled() && inputs.pytest && hashFiles('COVERAGE.md') != '' }}
        run: |
          {
            echo "## Coverage"
            echo
            cat COVERAGE.md
          } >> "$GITHUB_STEP_SUMMARY"

  pip-audit:
    name: pip-audit
    if: ${{ inputs.pip-audit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pip-audit
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Check lock file is up to date
        run: uv lock --locked

      - name: Export locked requirements
        # --no-emit-project: audit locked third-party deps even when the
        # local project is not installable (no need for uv sync).
        # --all-groups: include dev tools that CI installs.
        # --no-hashes: packages from custom indexes (for example
        # torch==...+cu130) have no hashes. pip-audit implies
        # --require-hashes when any line has a hash, so a mixed
        # export would fail. Audit the already-pinned list with
        # --disable-pip --no-deps instead of requiring hashes.
        run: |
          uv export \
            --frozen \
            --format requirements-txt \
            --all-groups \
            --no-emit-project \
            --no-annotate \
            --no-hashes \
            --output-file "${RUNNER_TEMP}/requirements.txt"

      - name: Run pip-audit
        env:
          PIP_AUDIT_IGNORE: ${{ inputs.pip-audit-ignore }}
        run: |
          set -euo pipefail
          ignore_args=()
          normalized=${PIP_AUDIT_IGNORE//,/ }
          # Word-splitting is intentional: IDs are whitespace/comma-separated.
          for id in $normalized; do
            if [[ "$id" =~ ^[A-Za-z0-9._:-]+$ ]]; then
              ignore_args+=(--ignore-vuln "$id")
            else
              echo "Invalid pip-audit-ignore ID: $id" >&2
              exit 1
            fi
          done

          set +e
          # --disable-pip --no-deps: audit the frozen, pinned list
          # without resolving dependencies or requiring hashes.
          # Do not pass --strict: packages missing from PyPI (local
          # versions such as torch==2.13.0+cu130) are skipped instead
          # of failing the job. Known vulnerabilities still exit
          # non-zero. Skipped packages are included in the markdown
          # report and copied to the step summary below.
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement "${RUNNER_TEMP}/requirements.txt" \
            --disable-pip \
            --no-deps \
            --progress-spinner off \
            --format markdown \
            --desc on \
            --output "${RUNNER_TEMP}/pip-audit.md" \
            "${ignore_args[@]}"
          status=$?
          set -e

          {
            echo "## pip-audit"
            echo
            if [[ -s "${RUNNER_TEMP}/pip-audit.md" ]]; then
              if grep -F -q -- "Skip Reason" "${RUNNER_TEMP}/pip-audit.md"; then
                echo "The following packages could not be audited and were skipped. Skips do not fail the job; known vulnerabilities still do."
                echo
              fi
              cat "${RUNNER_TEMP}/pip-audit.md"
            elif [[ "$status" -eq 0 ]]; then
              echo "No known vulnerabilities found."
            else
              echo "pip-audit failed without a markdown report (exit ${status})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
